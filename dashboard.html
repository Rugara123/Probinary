<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProBinary Dashboard</title>

<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<header class="topbar">

    <div class="top-row">

        <div class="logo">
            <h2>PB</h2>
        </div>

        <select id="accountType">
            <option>Demo</option>
            <option>Real</option>
        </select>

        <div class="balance-card">
            <small>Balance</small>
            <strong>$10,000</strong>
        </div>

        <button class="deposit-btn">
            + Deposit
        </button>

        <div class="status">🟢</div>

    </div>

    <div class="trade-tabs">

        <button class="active">Matches</button>

        <button>Even/Odd</button>

        <button>Over/Under</button>

    </div>

</header>

<section class="dashboard">

<div class="market-panel">

    <div class="market-header">

        <div>

            <h3>Volatility 10 (1s)</h3>

            <small>Live Market</small>

        </div>

        <div class="live-price">

            <span>Price</span>

            <strong id="livePrice">--.--</strong>

        </div>

    </div>

    <div id="chart"></div>

    <div class="digit-area">

        <div class="digits">

            <div class="digit"><span>0</span><p id="p0">0%</p></div>
            <div class="digit"><span>1</span><p id="p1">0%</p></div>
            <div class="digit"><span>2</span><p id="p2">0%</p></div>
            <div class="digit"><span>3</span><p id="p3">0%</p></div>
            <div class="digit"><span>4</span><p id="p4">0%</p></div>
            <div class="digit"><span>5</span><p id="p5">0%</p></div>
            <div class="digit"><span>6</span><p id="p6">0%</p></div>
            <div class="digit"><span>7</span><p id="p7">0%</p></div>
            <div class="digit"><span>8</span><p id="p8">0%</p></div>
            <div class="digit"><span>9</span><p id="p9">0%</p></div>

        </div>

        <div id="tickPointer">▲</div>

    </div>

</div>


<div class="trade-panel">

<div class="control-grid">

<div class="control-card">
<h4>Mode</h4>
<div class="switch-buttons">
<button class="active">Auto</button>
<button>Manual</button>
</div>
</div>

<div class="control-card">
<h4>Stake</h4>
<input type="number" value="10">
</div>

<div class="control-card">
<h4>AI Scanner</h4>
<div class="switch-buttons">
<button class="active">ON</button>
<button>OFF</button>
</div>
</div>

<div class="control-card">
<h4>Take Profit</h4>
<input type="number" value="200">
</div>

<div class="control-card">
<h4>Stop Loss</h4>
<input type="number" value="100">
</div>

<div class="control-card">
<h4>Martingale</h4>
<div class="switch-buttons">
<button>OFF</button>
<button>ON</button>
</div>
</div>

<div class="control-card">
<h4>Multiplier</h4>
<input type="number" step="0.1" value="2.0">
</div>

<div class="control-card">
<h4>Trade Type</h4>
<div class="switch-buttons">
<button>Even</button>
<button>Odd</button>
</div>
</div>

<div class="control-card">
<button class="trade-btn">Trade</button>
</div>

<div class="control-card">
<button class="positions-btn">Positions</button>
</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script src="chart.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
