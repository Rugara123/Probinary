<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ProBinary Dashboard</title>

<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<header class="topbar">

    <div class="top-row">

        <div class="logo">
            <h2>PB</h2>
        </div>

        <select id="accountType">
            <option>Demo</option>
            <option>Real</option>
        </select>

        <div class="balance-card">
            <small>Balance</small>
            <strong>$10,000</strong>
        </div>

        <button class="deposit-btn">
            + Deposit
        </button>

        <div class="status">🟢</div>

    </div>

    <div class="trade-tabs">

        <button class="active">Matches</button>

        <button>Even/Odd</button>

        <button>Over/Under</button>

    </div>

</header>

<section class="dashboard">

<div class="market-select">

<select id="market">

<option value="R_10_1S">Volatility 10 (1s)</option>

<option value="R_25">Volatility 25</option>

<option value="R_50">Volatility 50</option>

<option value="R_75">Volatility 75</option>

<option value="R_100">Volatility 100</option>

</select>

</div>

<div class="market-panel">

<div class="market-header">

<div>

<h3>Volatility 10 (1s)</h3>

<small>Live Market Feed</small>

</div>

<div class="live-price">

<span>Current Price</span>

<strong id="livePrice">--.--</strong>

</div>

</div>

<div id="chart"></div>

</div>

<div class="trade-tabs">

<button class="active">
Matches / Differs
</button>

<button>
Even / Odd
</button>

<button>
Over / Under
</button>

</div>

<h3>Digit Analysis</h3>

<div class="digit-area">

<div id="tickPointer">▼</div>

<div class="digits">

<div class="digit"><span>0</span><p id="p0">0%</p></div>
<div class="digit"><span>1</span><p id="p1">0%</p></div>
<div class="digit"><span>2</span><p id="p2">0%</p></div>
<div class="digit"><span>3</span><p id="p3">0%</p></div>
<div class="digit"><span>4</span><p id="p4">0%</p></div>
<div class="digit"><span>5</span><p id="p5">0%</p></div>
<div class="digit"><span>6</span><p id="p6">0%</p></div>
<div class="digit"><span>7</span><p id="p7">0%</p></div>
<div class="digit"><span>8</span><p id="p8">0%</p></div>
<div class="digit"><span>9</span><p id="p9">0%</p></div>

</div>

</div>

<div class="trade-panel">

<h3>Market Analysis</h3>

<p>
Current Digit:
<strong id="currentDigit">-</strong>
</p>

<p>
Probability:
<strong id="probability">--%</strong>
</p>

<button class="trade-btn">
Place Trade
</button>

</div>

<div class="history">

<h3>Last Ticks</h3>

<div id="historyDigits" class="history-digits">

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script src="chart.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
